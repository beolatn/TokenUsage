# GitHub Actions Release Workflow — Token Usage Plugin
#
# Belongs in the GitHub repo at: .github/workflows/release.yml
#
# Trigger: push a version tag (e.g. git tag 1.5.0 && git push origin 1.5.0)
# The workflow then:
#   1. Checks out the repo at that tag
#   2. Attests main.js, styles.css, manifest.json (Obsidian review: Artifact Attestations)
#   3. Creates the GitHub Release and uploads the three files as assets
#
# versions.json is intentionally NOT included as a release asset.
# It lives in the repo only — Obsidian reads it from there, not from the release.
#
# Required repository permission: Settings → Actions → Workflow permissions
#   → "Read and write permissions" + "Allow GitHub Actions to create attestations"
#
# Since 2.5 (security check 27.10.2026) every action is pinned to a full commit SHA, with the
# version as a comment. A tag like @v2 can be moved to other code by whoever controls that
# repository; a commit SHA cannot. The SHAs are exactly what @v4 / @v2 resolved to on
# 27.10.2026, so the release behaves as before. To update: look up the new tag with
# `git ls-remote --tags https://github.com/<owner>/<action>` and replace SHA and comment.

name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write      # create release + upload assets
  id-token: write      # OIDC token required for attestations
  attestations: write  # store attestation records on GitHub

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # nothing here pushes, so no token stays in .git/config

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            main.js
            manifest.json
            styles.css
